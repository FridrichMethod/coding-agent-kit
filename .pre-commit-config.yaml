# Pre-commit hooks for basic hygiene + shell scripts.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=40000, --enforce-all]

  # gitleaks scans the staged changes, so it guards commits once
  # `pre-commit install` has run in the clone. gitleaks-history scans every
  # commit on every ref; CI runs it after a full-depth checkout
  # (`pre-commit run --hook-stage manual gitleaks-history`). Both read the
  # rules in .gitleaks.toml, which extends the defaults.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the Git history
        entry: gitleaks git --redact --verbose
        always_run: true
        stages: [manual]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: (\.sh$|/\.local/bin/(codex|claude)-as$|/bash-completion/completions/.*$)
        types: [file]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, bash]
        files: (\.sh$|/\.local/bin/codex-as$|/bash-completion/completions/.*$)
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, posix]
        files: /\.local/bin/claude-as$
        types: [file]
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, zsh]
        files: /custom/completions/_[^/]+$
        # The upstream hook selects the shell type, which identify does not
        # give the extension-less completions; every file the pattern names
        # is checked instead.
        types: [file]

  - repo: local
    hooks:
      - id: english-documentation
        name: English documentation (ASCII only)
        language: pygrep
        entry: '[^\x09\x0a\x0d\x20-\x7e]'
        types: [file]
        files: '(?i)(\.(md|markdown|mdx|rst|txt)$|(^|/)(README|CHANGELOG|CONTRIBUTING|AUTHORS|LICENSE|NOTICE)(\.[^/]*)?$)'
      - id: claude-customizations
        name: Claude status line, notifications and Git hook guard
        entry: node --test tests/claude-customizations.cjs
        language: system
        pass_filenames: false
        files: ^(common/claude/.*|tests/(claude-customizations\.cjs|fixtures/claude-settings\.json))$
      - id: codex-as
        name: Codex account views and native sharing (isolated Bash/zsh)
        entry: tests/codex-as.sh
        language: script
        pass_filenames: false
        files: ^(common/codex/\.local/(bin/codex-as|lib/codex-as/.*)|tests/(codex-as\.sh|test_codex_as\.py|test_codex_sharing_native\.py|fixtures/(zsh|bash)_aliases))$
      - id: account-enrollment
        name: account enrollment and completion (isolated HOME and native CLI fakes)
        entry: tests/account-enrollment.sh
        language: script
        pass_filenames: false
        files: ^(common/(codex|claude)/.*|tests/(account-enrollment\.sh|test_account_enrollment\.py))$
      - id: test-entrypoints
        name: test entry points and dotfiles knob hygiene
        entry: tests/test-entrypoints.sh
        language: script
        pass_filenames: false
        files: ^(tests/.*\.(sh|ps1)|lib/.*|common/.*)$
