# Pre-commit hooks for basic hygiene + shell scripts.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=40000, --enforce-all]

  # gitleaks scans the staged changes, so it guards commits once
  # `pre-commit install` has run in the clone. gitleaks-history scans every
  # commit on every ref; CI runs it after a full-depth checkout
  # (`pre-commit run --hook-stage manual gitleaks-history`). Both read the
  # rules in .gitleaks.toml, which extends the defaults.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the Git history
        entry: gitleaks git --redact --verbose
        always_run: true
        stages: [manual]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: (\.sh$|^bin/(codex|claude)-as$|^completions/bash/.*$)
        types: [file]

  # The upstream hook selects the shell type, which identify does not give the
  # extension-less completions; each hook checks every file its pattern names
  # instead.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, bash]
        files: (\.sh$|^bin/codex-as$|^completions/bash/.*$)
        exclude: ^install\.sh$
        types: [file]
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, posix]
        files: ^(bin/claude-as|install\.sh)$
        types: [file]
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, zsh]
        files: ^completions/zsh/_[^/]+$
        types: [file]

  - repo: local
    hooks:
      - id: english-documentation
        name: English documentation (ASCII only)
        language: pygrep
        entry: '[^\x09\x0a\x0d\x20-\x7e]'
        types: [file]
        files: '(?i)(\.(md|markdown|mdx|rst|txt)$|(^|/)(README|CHANGELOG|CONTRIBUTING|AUTHORS|LICENSE|NOTICE)(\.[^/]*)?$)'
      - id: claude-customizations
        name: Claude status line, notifications and Git hook guard
        entry: node --test tests/claude-customizations.cjs
        language: system
        pass_filenames: false
        files: ^(helpers/.*|tests/(claude-customizations\.cjs|fixtures/claude-settings\.json))$
      - id: codex-as
        name: Codex account views and native sharing (isolated Bash/zsh)
        entry: tests/codex-as.sh
        language: script
        pass_filenames: false
        files: ^(bin/codex-as|lib/(codex-as|coding-agent-kit)/.*|tests/(codex-as\.sh|test_codex_as\.py|test_codex_sharing_native\.py|fixtures/(zsh|bash)_aliases))$
      - id: account-enrollment
        name: account enrollment and completion (isolated HOME and native CLI fakes)
        entry: tests/account-enrollment.sh
        language: script
        pass_filenames: false
        files: ^(bin/.*|lib/.*|completions/.*|tests/(account-enrollment\.sh|test_account_enrollment\.py|test_codex_as\.py))$
      - id: config
        name: kit configuration, launcher location and metadata queries (isolated HOME)
        entry: tests/config.sh
        language: script
        pass_filenames: false
        files: ^(bin/.*|lib/.*|completions/.*|docs/account-launchers\.md|tests/(config\.sh|test_config\.py|test_codex_as\.py))$
      - id: account-info
        name: account metadata, Codex usage scan and queries (isolated HOME and fakes)
        entry: tests/account-info.sh
        language: script
        pass_filenames: false
        files: ^(bin/.*|lib/.*|tests/(account-info\.sh|test_account_info\.py))$
      - id: test-entrypoints
        name: test entry points and kit knob hygiene
        entry: tests/test-entrypoints.sh
        language: script
        pass_filenames: false
        files: ^(tests/(.*\.(sh|ps1)|test_config\.py)|bin/.*|lib/.*|completions/.*|helpers/.*|install\.sh)$
      - id: contract
        name: public contract (paths, modes, no symlinks)
        entry: tests/contract.sh
        language: script
        pass_filenames: false
        files: ^(bin/.*|lib/.*|completions/.*|helpers/.*|docs/.*|install\.sh|tests/contract\.sh)$
      - id: standalone-e2e
        name: standalone install and launchers from a plain clone (temporary HOME, fakes)
        entry: tests/standalone-e2e.sh
        language: script
        pass_filenames: false
        files: ^(install\.sh|bin/.*|lib/.*|completions/.*|docs/account-launchers\.md|tests/standalone-e2e\.sh)$
      - id: managed-install
        name: managed install, update and uninstall from a local release repository (temporary HOME, no network)
        entry: tests/managed-install.sh
        language: script
        pass_filenames: false
        files: ^(install\.sh|bin/.*|lib/.*|completions/.*|helpers/.*|docs/account-launchers\.md|tests/managed-install\.sh)$
