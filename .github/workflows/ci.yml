name: ci

on:
  pull_request:
  # main, and ci/** branches: there a change runs on all three systems before
  # main is fast-forwarded to it, with no pull request.
  push:
    branches: [main, "ci/**"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux behavior and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full depth, every branch and tag, for the gitleaks history scan.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      # --ci requires zsh for the zsh launcher and completion cases; dash, the
      # image's /bin/sh, runs install.sh in the standalone end-to-end test,
      # and GNU Stow builds its folded Stow layouts. standalone-e2e.sh skips
      # those cases without Stow, so the step fails unless their heading is in
      # the output; `shell: bash` adds pipefail, so a failing run.sh fails too.
      - name: Install zsh and GNU Stow
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh stow
      - name: Run behavior tests with required CI prerequisites
        shell: bash
        run: |
          /bin/bash ./tests/run.sh --ci | tee "$RUNNER_TEMP/tests.log"
          grep -Fqx '==> refusals: destinations in directories GNU Stow folded into another repository' "$RUNNER_TEMP/tests.log" ||
            { echo '::error::standalone-e2e.sh skipped its folded Stow cases.'; exit 1; }
      # The same steps pre-commit/action@v3.0.1 runs, without its unmaintained
      # actions/cache@v4 pin (Node 20). Same cache path and key.
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files
      - name: Scan the full Git history for secrets
        run: pre-commit run --color=always --hook-stage manual gitleaks-history
      # An untracked file in a consumer's submodule checkout can stop its
      # updates, so tests and hooks must leave nothing behind.
      - name: Check that tests and hooks left no file behind
        run: |
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

  macos:
    name: macOS system Bash behavior
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      # macOS ships zsh, which --ci requires; install it only if the image lacks it.
      - name: Check for zsh
        run: command -v zsh || brew install zsh
      # The tests run under /bin/bash 3.2, and the standalone end-to-end test
      # runs install.sh under /bin/sh and drives the launchers through its links.
      - name: Run behavior tests with system Bash, /bin/sh and BSD utilities
        run: /bin/bash ./tests/run.sh --ci
      - name: Check that tests left no file behind
        run: |
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

  windows:
    name: Windows native PowerShell behavior
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
    steps:
      # The runner's default core.autocrlf stays on, so the LF check below
      # proves .gitattributes, not a runner setting.
      - uses: actions/checkout@v6
      # run.ps1 runs only the Node suite of the Claude Code helpers.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      # The launchers and completions are shell scripts, where a CRLF
      # `set -eu` fails.
      - name: Check that the working tree has LF line endings
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $crlf = @(git ls-files --eol | Select-String -SimpleMatch 'w/crlf')
          if ($crlf.Count -gt 0) {
              $crlf | ForEach-Object { Write-Output $_.Line }
              throw 'Files in the working tree have CRLF line endings.'
          }
      - name: Run required native PowerShell and Node suites
        run: ./tests/run.ps1 -CI
      - name: Check that tests left no file behind
        shell: bash
        run: |
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
